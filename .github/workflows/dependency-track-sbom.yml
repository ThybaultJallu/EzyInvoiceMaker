name: Dependency-Track SBOM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  sbom:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Install CycloneDX SBOM generator
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM (CycloneDX)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-CycloneDX EzyInvoiceMaker/EzyInvoiceMaker.csproj -o . -F Json -fn bom.json

      # The official action takes serverhostname/protocol/port separately,
      # while the DTRACK_URL secret is a full URL. Derive the pieces from it
      # so no new secret is required.
      - name: Parse Dependency-Track URL
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}       # ex: https://dtrack.tondomaine.com
        run: |
          protocol="${DTRACK_URL%%://*}"
          rest="${DTRACK_URL#*://}"
          hostport="${rest%%/*}"
          host="${hostport%%:*}"
          port="${hostport##*:}"
          if [ "$port" = "$hostport" ]; then
            # No explicit port in the URL; pick the default for the scheme.
            if [ "$protocol" = "http" ]; then port=80; else port=443; fi
          fi
          {
            echo "DTRACK_PROTOCOL=$protocol"
            echo "DTRACK_HOSTNAME=$host"
            echo "DTRACK_PORT=$port"
          } >> "$GITHUB_ENV"

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverhostname: ${{ env.DTRACK_HOSTNAME }}
          protocol: ${{ env.DTRACK_PROTOCOL }}
          port: ${{ env.DTRACK_PORT }}
          apikey: ${{ secrets.DTRACK_API_KEY }}
          project: ${{ secrets.DTRACK_PROJECT_UUID }}
          bomfilename: bom.json
